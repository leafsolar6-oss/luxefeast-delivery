name: luxefeast_rider
description: Premium rider delivery app with notifications, real-time updates, and payment dashboard.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  http: ^1.2.2
  geolocator: ^12.0.0
  socket_io_client: ^3.1.6
  provider: ^6.1.2
  shared_preferences: ^2.3.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
