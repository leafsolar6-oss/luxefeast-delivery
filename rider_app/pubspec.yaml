name: luxefeast_rider
description: Premium rider delivery app with notifications, real-time updates, and payment dashboard.
publish_to: 'none'
version: 4.2.0+6

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  http: ^1.2.2
  geolocator: ^12.0.0
  socket_io_client: 2.0.3+1

  # Firebase push notifications (FCM)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.1
  provider: ^6.1.2
  shared_preferences: ^2.3.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
