version: '3.9'
# Local development stack — production uses Neon (serverless Postgres), see render.yaml
services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://luxefeast:luxefeast@postgres:5432/luxefeast
    depends_on:
      - postgres
    networks:
      - luxefeast

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=luxefeast
      - POSTGRES_PASSWORD=luxefeast
      - POSTGRES_DB=luxefeast
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - luxefeast

networks:
  luxefeast:

volumes:
  pg_data:
